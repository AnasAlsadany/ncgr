<div class="side_bar">
    <div class="list-sidbar">
        <h4>روابط لوحة التحكم</h4>
        <hr />
        <ul>
            <li *ngFor="let item of sidebarItems">
                <ng-container *ngIf="!item.children">
                    <a [routerLink]="item.route" routerLinkActive="active">
                        <img [src]="item.icon" alt="" />
                        <span>{{ item.label }}</span>
                    </a>
                </ng-container>

                <ng-container *ngIf="item.children">
                    <a class="btn" data-bs-toggle="collapse" href="#contentPages" role="button">
                        <img [src]="item.icon" alt="" />
                        <span>{{ item.label }}</span>
                    </a>
                    <div class="collapse collaps_item_list" id="contentPages">
                        <div class="sm_card_list">
                            <ul class="sm_list_dashboard">
                                <li *ngFor="let child of item.children">
                                    <a [routerLink]="child.route">{{ child.label }}</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </ng-container>
            </li>
        </ul>
    </div>
</div>
